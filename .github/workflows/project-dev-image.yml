name: Project dev image

on:
  push:
    branches: [main, master]
    paths:
      - docker/Dockerfile.dev
      - docker/project-image.json
      - .github/workflows/project-dev-image.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          VERSION=$(jq -r .version docker/project-image.json)
          REPO=$(jq -r .repository docker/project-image.json)
          LABEL=$(jq -r .versionLabel docker/project-image.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Publish base stage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          target: base
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}-base:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.repo }}-base:latest
          labels: |
            ${{ steps.meta.outputs.label }}=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=ide-dev-base
          cache-to: type=gha,mode=max,scope=ide-dev-base

      - name: Publish AI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          target: ai
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.repo }}:latest
          labels: |
            ${{ steps.meta.outputs.label }}=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=ide-dev
          cache-to: type=gha,mode=max,scope=ide-dev
